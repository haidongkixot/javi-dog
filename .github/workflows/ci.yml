name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Every push to the working branch is a production deploy and needs its own CI result
  # (Guru G2-F2): only pull-request runs are cancelled by newer ones.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Lint · Typecheck · Test · Build · Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Migration drift (schema vs committed SQL, ADR-0005)
        run: |
          pnpm --filter @javis-dog/event-store db:generate
          test -z "$(git status --porcelain packages/event-store/migrations)"
      - run: pnpm docs:check
        env:
          DOC_DRIFT_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
